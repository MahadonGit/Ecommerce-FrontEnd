<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Feedback - Ecommerce Store</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Page Header -->

    <header>

        <h1>My Feedback</h1>

        <nav>

            <a href="products.html">
                Products
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a href="profile.html">
                My Profile
            </a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <!-- Submit Feedback -->

        <section>

            <h2>Leave Feedback</h2>

            <form>

                <!-- Product -->

                <div>

                    <label for="product">
                        Product
                    </label>

                    <select id="product"
                            name="product">

                        <option value="">
                            Select Product
                        </option>

                        <option value="1">
                            Gaming Laptop
                        </option>

                        <option value="2">
                            Wireless Mouse
                        </option>

                    </select>

                </div>


                <!-- Rating -->

                <div>

                    <label for="rating">
                        Rating
                    </label>

                    <select id="rating"
                            name="rating">

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            5 - Excellent
                        </option>

                        <option value="4">
                            4 - Very Good
                        </option>

                        <option value="3">
                            3 - Good
                        </option>

                        <option value="2">
                            2 - Poor
                        </option>

                        <option value="1">
                            1 - Very Poor
                        </option>

                    </select>

                </div>


                <!-- Comment -->

                <div>

                    <label for="comment">
                        Your Feedback
                    </label>

                    <textarea
                        id="comment"
                        name="comment"
                        rows="5"
                        placeholder="Write your feedback here...">
                    </textarea>

                </div>


                <!-- Submit -->

                <button type="submit">
                    Submit Feedback
                </button>

            </form>

        </section>


        <!-- Existing Feedback -->

        <section>

            <h2>My Previous Feedback</h2>


            <!-- Feedback 1 -->

            <article>

                <h3>Gaming Laptop</h3>

                <p>
                    <strong>Rating:</strong>
                    5 / 5
                </p>

                <p>
                    <strong>Comment:</strong>
                    Excellent product. Very good performance.
                </p>

                <button type="button">
                    Edit
                </button>

                <button type="button">
                    Delete
                </button>

            </article>


            <!-- Feedback 2 -->

            <article>

                <h3>Wireless Mouse</h3>

                <p>
                    <strong>Rating:</strong>
                    4 / 5
                </p>

                <p>
                    <strong>Comment:</strong>
                    Good quality and comfortable to use.
                </p>

                <button type="button">
                    Edit
                </button>

                <button type="button">
                    Delete
                </button>

            </article>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 Ecommerce Store
        </p>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ECommerce</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="card register-card shadow">

                    <div class="card-body p-4 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-2">Create Account</h2>
                            <p class="text-muted mb-0">
                                Register to start shopping
                            </p>
                        </div>

                        <!-- Register Form -->
                        <form id="registerForm" novalidate>

                            <!-- First Name -->
                            <div class="mb-3">
                                <label for="firstName" class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="firstName"
                                    class="form-control"
                                    placeholder="Enter your first name"
                                    autocomplete="given-name">

                                <div id="firstNameError" class="invalid-feedback">
                                    First name is required.
                                </div>
                            </div>


                            <!-- Last Name -->
                            <div class="mb-3">
                                <label for="lastName" class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="lastName"
                                    class="form-control"
                                    placeholder="Enter your last name"
                                    autocomplete="family-name">

                                <div id="lastNameError" class="invalid-feedback">
                                    Last name is required.
                                </div>
                            </div>


                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email">

                                <div id="emailError" class="invalid-feedback">
                                    Please enter a valid email address.
                                </div>
                            </div>


                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">
                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                        autocomplete="new-password">

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary password-toggle"
                                        id="togglePassword">
                                        Show
                                    </button>
                                </div>

                                <small class="text-muted">
                                    Password must be at least 6 characters.
                                </small>

                                <div id="passwordError" class="invalid-feedback">
                                    Password must be at least 6 characters.
                                </div>
                            </div>


                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <div class="input-group">
                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        placeholder="Confirm your password"
                                        autocomplete="new-password">

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary password-toggle"
                                        id="toggleConfirmPassword">
                                        Show
                                    </button>
                                </div>

                                <div id="confirmPasswordError" class="invalid-feedback">
                                    Passwords do not match.
                                </div>
                            </div>


                            <!-- General Message -->
                            <div id="message" class="mb-3"></div>


                            <!-- Register Button -->
                            <button
                                type="submit"
                                id="registerButton"
                                class="btn btn-primary w-100">

                                Create Account

                            </button>

                        </form>


                        <!-- Login Link -->
                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Already have an account?
                            </span>

                            <a href="login.html" class="text-decoration-none fw-semibold">
                                Login
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="../../js/auth/register.js"></script>

</body>

</html>

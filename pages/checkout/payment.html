<!-- Payment Methods -->

<div class="payment-method">

    <input
        type="radio"
        name="paymentMethod"
        id="cashOnDelivery"
        value="1">

    <label
        for="cashOnDelivery"
        class="payment-method-content">

        <div class="payment-method-icon">
            📦
        </div>

        <div>
            <h6>Cash on Delivery</h6>

            <p>
                Pay when your order arrives.
            </p>
        </div>

    </label>

</div>

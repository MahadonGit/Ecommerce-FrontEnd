<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="container py-5">

        <div class="admin-page-header">

            <div>
                <h1>Notifications</h1>
                <p>Send notifications to customers and users.</p>
            </div>

        </div>


        <div class="row g-4">

            <div class="col-lg-7">

                <div class="admin-card">

                    <h4>
                        Create Notification
                    </h4>

                    <p class="text-muted">
                        Send a notification to a specific user.
                    </p>

                    <hr>

                    <form>

                        <div class="mb-3">

                            <label
                                for="userId"
                                class="form-label">
                                User ID
                            </label>

                            <input
                                type="text"
                                id="userId"
                                class="form-control"
                                placeholder="Enter user ID">

                        </div>


                        <div class="mb-3">

                            <label
                                for="notificationTitle"
                                class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                id="notificationTitle"
                                class="form-control"
                                maxlength="100"
                                placeholder="Notification title">

                        </div>


                        <div class="mb-3">

                            <label
                                for="notificationMessage"
                                class="form-label">
                                Message
                            </label>

                            <textarea
                                id="notificationMessage"
                                class="form-control"
                                rows="5"
                                maxlength="500"
                                placeholder="Enter notification message..."></textarea>

                        </div>


                        <div class="mb-4">

                            <label
                                for="notificationType"
                                class="form-label">
                                Type
                            </label>

                            <select
                                id="notificationType"
                                class="form-select">

                                <option>
                                    Email
                                </option>

                                <option>
                                    SMS
                                </option>

                                <option>
                                    System
                                </option>

                                <option>
                                    Push
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Create Notification

                        </button>

                    </form>

                </div>

            </div>


            <div class="col-lg-5">

                <div class="admin-card">

                    <h4>
                        Recent Notifications
                    </h4>

                    <div class="admin-notification-list">

                        <div class="admin-notification-item">

                            <strong>
                                Order Confirmed
                            </strong>

                            <p>
                                Order #1045 has been confirmed.
                            </p>

                            <small>
                                Email · 2 minutes ago
                            </small>

                        </div>


                        <div class="admin-notification-item">

                            <strong>
                                Payment Successful
                            </strong>

                            <p>
                                Payment #25 was completed.
                            </p>

                            <small>
                                System · 1 hour ago
                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

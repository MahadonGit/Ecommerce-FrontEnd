<!-- =========================================
     PAYMENT METHOD
     ========================================= -->

<section class="checkout-section">

    <div class="checkout-section-header">

        <div>

            <h2>
                Payment Method
            </h2>

            <p>
                Select how you want to pay for your order.
            </p>

        </div>

    </div>


    <!-- Cash on Delivery -->

    <div class="payment-method">

        <input
            type="radio"
            name="paymentMethod"
            id="cashOnDelivery"
            value="1">

        <label
            for="cashOnDelivery"
            class="payment-method-content">

            <div class="payment-method-icon">
                📦
            </div>

            <div class="payment-method-info">

                <h6>
                    Cash on Delivery
                </h6>

                <p>
                    Pay when your order arrives.
                </p>

            </div>

        </label>

    </div>


    <!-- Credit Card -->

    <div class="payment-method">

        <input
            type="radio"

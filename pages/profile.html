<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Ecommerce Store</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Page Header -->

    <header>

        <h1>My Profile</h1>

        <nav>

            <a href="products.html">
                Products
            </a>

            <a href="categories.html">
                Categories
            </a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <section>

            <h2>Personal Information</h2>

            <form>

                <div>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div>

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <button type="submit">
                    Update Profile
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 Ecommerce Store
        </p>

    </footer>

</body>

</html>

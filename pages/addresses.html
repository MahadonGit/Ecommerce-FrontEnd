<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Addresses - Ecommerce Store</title>
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Page Header -->

    <header>

        <h1>My Addresses</h1>

        <nav>

            <a href="products.html">
                Products
            </a>

            <a href="profile.html">
                My Profile
            </a>

        </nav>

    </header>


    <!-- Main Content -->

    <main>

        <!-- Saved Addresses -->

        <section>

            <h2>Saved Addresses</h2>

            <article>

                <h3>Home Address</h3>

                <p>
                    123 Main Street
                </p>

                <p>
                    Gojra, Punjab, Pakistan
                </p>

                <p>
                    Postal Code: 56000
                </p>

                <button type="button">
                    Edit
                </button>

                <button type="button">
                    Delete
                </button>

            </article>

        </section>


        <!-- Add New Address -->

        <section>

            <h2>Add New Address</h2>

            <form>

                <!-- Address Line -->

                <div>

                    <label for="addressLine">
                        Address
                    </label>

                    <input
                        type="text"
                        id="addressLine"
                        name="addressLine"
                        placeholder="Enter your complete address"
                    >

                </div>


                <!-- City -->

                <div>

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                    >

                </div>


                <!-- State -->

                <div>

                    <label for="state">
                        State / Province
                    </label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        placeholder="Enter your state or province"
                    >

                </div>


                <!-- Postal Code -->

                <div>

                    <label for="postalCode">
                        Postal Code
                    </label>

                    <input
                        type="text"
                        id="postalCode"
                        name="postalCode"
                        placeholder="Enter postal code"
                    >

                </div>


                <!-- Country -->

                <div>

                    <label for="country">
                        Country
                    </label>

                    <select
                        id="country"
                        name="country">

                        <option value="">
                            Select Country
                        </option>

                        <option value="Pakistan">
                            Pakistan
                        </option>

                        <option value="USA">
                            United States
                        </option>

                        <option value="UK">
                            United Kingdom
                        </option>

                    </select>

                </div>


                <!-- Save Button -->

                <button type="submit">
                    Save Address
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 Ecommerce Store
        </p>

    </footer>

</body>

</html>

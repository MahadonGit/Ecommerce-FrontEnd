<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirm Email - ECommerce</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="card auth-card">

                    <div class="card-body p-4 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-4">

                            <div class="auth-icon mb-3">
                                ✉
                            </div>

                            <h2 class="fw-bold mb-2">
                                Confirm Your Email
                            </h2>

                            <p class="text-muted mb-0">
                                Please confirm your email address
                                to activate your account.
                            </p>

                        </div>


                        <!-- Confirm Email Form -->
                        <form id="confirmEmailForm" novalidate>

                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email">

                                <div class="invalid-feedback">
                                    Please enter a valid email address.
                                </div>

                            </div>


                            <!-- Token -->
                            <div class="mb-3">

                                <label
                                    for="token"
                                    class="form-label">
                                    Confirmation Token
                                </label>

                                <input
                                    type="text"
                                    id="token"
                                    class="form-control"
                                    placeholder="Enter confirmation token">

                                <div class="invalid-feedback">
                                    Confirmation token is required.
                                </div>

                            </div>


                            <!-- Message -->
                            <div id="message" class="mb-3"></div>


                            <!-- Confirm Button -->
                            <button
                                type="submit"
                                id="confirmButton"
                                class="btn btn-primary w-100">

                                Confirm Email

                            </button>

                        </form>


                        <!-- Resend Section -->
                        <div class="resend-section text-center mt-4 pt-4">

                            <p class="text-muted mb-2">
                                Didn't receive the confirmation email?
                            </p>

                            <button
                                type="button"
                                id="resendButton"
                                class="btn btn-link text-decoration-none">

                                Resend Confirmation

                            </button>

                        </div>


                        <!-- Login Link -->
                        <div class="auth-switch text-center mt-3">

                            <span>
                                Already confirmed?
                            </span>

                            <a
                                href="login.html"
                                class="text-decoration-none">

                                Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="../../js/auth/confirm-email.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Role Management - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="container py-5">

        <div class="admin-page-header">

            <div>
                <h1>Role Management</h1>
                <p>Assign roles to registered users.</p>
            </div>

        </div>


        <div class="row g-4">

            <div class="col-lg-6">

                <div class="admin-card">

                    <h4>
                        Assign Role
                    </h4>

                    <p class="text-muted">
                        Select a user and assign an appropriate role.
                    </p>

                    <hr>

                    <form>

                        <div class="mb-3">

                            <label
                                for="userEmail"
                                class="form-label">
                                User Email
                            </label>

                            <input
                                type="email"
                                id="userEmail"
                                class="form-control"
                                placeholder="user@example.com">

                        </div>


                        <div class="mb-4">

                            <label
                                for="role"
                                class="form-label">
                                Role
                            </label>

                            <select
                                id="role"
                                class="form-select">

                                <option>
                                    Customer
                                </option>

                                <option>
                                    Manager
                                </option>

                                <option>
                                    Admin
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Assign Role
                        </button>

                    </form>

                </div>

            </div>


            <div class="col-lg-6">

                <div class="admin-card">

                    <h4>
                        Current Roles
                    </h4>

                    <div class="role-list">

                        <div class="role-row">
                            <span>admin@example.com</span>
                            <span class="role-badge">Admin</span>
                        </div>

                        <div class="role-row">
                            <span>manager@example.com</span>
                            <span class="role-badge">Manager</span>
                        </div>

                        <div class="role-row">
                            <span>customer@example.com</span>
                            <span class="role-badge">Customer</span>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Products - ECommerce</title>


<!-- Bootstrap CSS -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- Products CSS -->

<link
    rel="stylesheet"
    href="../css/products.css">
```

</head>

<body>

<!-- =========================================
     NAVBAR
     ========================================= -->

<nav class="navbar navbar-expand-lg products-navbar">

```
<div class="container">


    <!-- Brand -->

    <a
        class="navbar-brand"
        href="../index.html">

        ECommerce

    </a>


    <!-- Mobile Button -->

    <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#productsNavbar"
        aria-controls="productsNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

    </button>


    <!-- Navbar Content -->

    <div
        class="collapse navbar-collapse"
        id="productsNavbar">


        <ul class="navbar-nav me-auto mb-2 mb-lg-0">


            <!-- Products -->

            <li class="nav-item">

                <a
                    class="nav-link active"
                    href="products.html">

                    Products

                </a>

            </li>


            <!-- Cart -->

            <li class="nav-item">

                <a
                    class="nav-link"
                    href="cart.html">

                    Cart

                </a>

            </li>


            <!-- Orders -->

            <li class="nav-item">

                <a
                    class="nav-link"
                    href="orders.html">

                    Orders

                </a>

            </li>


            <!-- Notifications -->

            <li class="nav-item">

                <a
                    class="nav-link"
                    href="notifications.html">

                    Notifications

                </a>

            </li>

        </ul>


        <!-- Account -->

        <a
            href="profile.html"
            class="btn btn-primary products-account-button">

            My Account

        </a>

    </div>

</div>
```

</nav>

<!-- =========================================
     MAIN CONTENT
     ========================================= -->

<main>

```
<div class="container py-5">


    <!-- =================================
         PAGE HEADER
         ================================= -->

    <div class="products-page-header mb-4">

        <div>

            <h1>
                Our Products
            </h1>

            <p>
                Browse our available products.
            </p>

        </div>

    </div>



    <!-- =================================
         SEARCH + SORT
         ================================= -->

    <div class="products-controls mb-4">


        <!-- Search -->

        <div class="product-search">

            <label
                for="searchInput"
                class="form-label">

                Search Products

            </label>


            <div class="input-group">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search products...">

                <button
                    type="button"
                    id="searchButton"
                    class="btn btn-primary">

                    Search

                </button>

            </div>

        </div>


        <!-- Sorting -->

        <div class="product-sorting">

            <label
                for="sortBy"
                class="form-label">

                Sort By

            </label>


            <div class="row g-2">

                <div class="col">

                    <select
                        id="sortBy"
                        class="form-select">

                        <option value="name">
                            Name
                        </option>

                        <option value="price">
                            Price
                        </option>

                        <option value="stockQuantity">
                            Stock
                        </option>

                        <option value="createdDate">
                            Date
                        </option>

                    </select>

                </div>


                <div class="col">

                    <select
                        id="sortOrder"
                        class="form-select">

                        <option value="asc">
                            Ascending
                        </option>

                        <option value="desc">
                            Descending
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>



    <!-- =================================
         PRODUCTS
         ================================= -->

    <section>

        <div
            id="productsContainer"
            class="row g-4">

            <!--
                Products will be loaded
                using JavaScript later.
            -->

        </div>

    </section>



    <!-- =================================
         EMPTY STATE
         ================================= -->

    <div
        id="emptyProducts"
        class="products-empty d-none">

        <div class="empty-product-icon">
            🛍️
        </div>

        <h3>
            No Products Found
        </h3>

        <p>
            Try changing your search or sorting options.
        </p>

    </div>



    <!-- =================================
         PAGINATION
         ================================= -->

    <nav
        class="products-pagination mt-5"
        aria-label="Products pagination">

        <div
            id="pagination"
            class="d-flex justify-content-center">

            <!-- Pagination buttons will be added later -->

        </div>

    </nav>

</div>
```

</main>

<!-- =========================================
     FOOTER
     ========================================= -->

<footer class="products-footer">

```
<div class="container">

    <div class="text-center">

        <p class="mb-0">

            © 2026 ECommerce Store.
            All rights reserved.

        </p>

    </div>

</div>
```

</footer>

<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payments - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="container-fluid py-4">

        <div class="admin-page-header">

            <div>
                <h1>Payments</h1>
                <p>Monitor and manage customer payments.</p>
            </div>

            <select class="form-select admin-filter">

                <option>
                    All Statuses
                </option>

                <option>
                    Pending
                </option>

                <option>
                    Completed
                </option>

                <option>
                    Failed
                </option>

                <option>
                    Refunded
                </option>

            </select>

        </div>


        <div class="admin-card">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>
                            <th>Payment</th>
                            <th>Order</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Transaction</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                #25
                            </td>

                            <td>
                                #1045
                            </td>

                            <td>
                                $150.00
                            </td>

                            <td>
                                JazzCash
                            </td>

                            <td>
                                <span class="status completed">
                                    Completed
                                </span>
                            </td>

                            <td>
                                TXN-123456
                            </td>

                            <td>

                                <a
                                    href="payment-status.html"
                                    class="btn btn-sm btn-outline-primary">
                                    Update
                                </a>

                            </td>

                        </tr>

                        <tr>

                            <td>
                                #24
                            </td>

                            <td>
                                #1044
                            </td>

                            <td>
                                $89.99
                            </td>

                            <td>
                                Cash on Delivery
                            </td>

                            <td>
                                <span class="status pending">
                                    Pending
                                </span>
                            </td>

                            <td>
                                —
                            </td>

                            <td>

                                <a
                                    href="payment-status.html"
                                    class="btn btn-sm btn-outline-primary">
                                    Update
                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>

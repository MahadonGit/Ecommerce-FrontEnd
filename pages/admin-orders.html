<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="container-fluid py-4">

        <div class="admin-page-header">

            <div>
                <h1>Orders</h1>
                <p>Manage customer orders.</p>
            </div>

            <select class="form-select admin-filter">

                <option>
                    All Orders
                </option>

                <option>
                    Pending
                </option>

                <option>
                    Processing
                </option>

                <option>
                    Completed
                </option>

                <option>
                    Cancelled
                </option>

            </select>

        </div>


        <div class="admin-card">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Order Status</th>
                            <th>Payment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>
                                <strong>#1045</strong>
                            </td>

                            <td>
                                Mahad Abrar
                            </td>

                            <td>
                                27 Aug 2026
                            </td>

                            <td>
                                $150.00
                            </td>

                            <td>
                                <span class="status processing">
                                    Processing
                                </span>
                            </td>

                            <td>
                                <span class="status completed">
                                    Paid
                                </span>
                            </td>

                            <td>
                                <button class="btn btn-sm btn-primary">
                                    View
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <strong>#1044</strong>
                            </td>

                            <td>
                                Ahmed
                            </td>

                            <td>
                                26 Aug 2026
                            </td>

                            <td>
                                $89.99
                            </td>

                            <td>
                                <span class="status pending">
                                    Pending
                                </span>
                            </td>

                            <td>
                                <span class="status pending">
                                    Pending
                                </span>
                            </td>

                            <td>
                                <button class="btn btn-sm btn-primary">
                                    View
                                </button>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
